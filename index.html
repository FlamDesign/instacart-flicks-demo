<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flicks on Instacart Ads: Concept Demo</title>
<style>
:root{
  --kale:#003d29; --kale-2:#0b4d36; --green:#108910; --green-d:#0b6e0b; --green-t:#e6f4e6;
  --carrot:#ff7009; --cashew:#faf1e5; --ink:#343538; --ink-2:#72767e; --ink-3:#9a9ea6;
  --line:#e8e9eb; --line-2:#f0f1f2; --chip:#f6f7f8; --img:#f6f7f8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--cashew);color:var(--ink);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
input{font:inherit;color:inherit}

/* ================= page layout ================= */
.page{min-height:100vh}
.stagewrap{display:grid;place-items:center;padding:24px;min-height:100vh;position:relative}
.stagewrap::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 45%,#fff7ec 0%,rgba(250,241,229,0) 70%);pointer-events:none}
.phone-slot{position:relative}
.phone{position:absolute;left:0;top:0;width:414px;height:868px;padding:12px;border-radius:58px;background:#101312;box-shadow:0 0 0 2px #2b2f2e inset,0 40px 80px -30px rgba(0,61,41,.45),0 18px 36px -18px rgba(0,0,0,.35);transform-origin:0 0}
.phone::after{content:"";position:absolute;top:24px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:60;pointer-events:none}

/* ad format picker: floating pill + compact list */
.gpill{position:fixed;right:24px;bottom:24px;z-index:90;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 16px;border-radius:999px;background:var(--kale);color:#fff;font-weight:700;font-size:14px;box-shadow:0 10px 28px -8px rgba(0,61,41,.6)}
.gpill:hover{background:var(--kale-2)}
.gpill i{font-style:normal;background:#fff;color:var(--kale);border-radius:999px;font-size:11.5px;font-weight:800;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.gscrim{position:fixed;inset:0;z-index:89;display:none}
.gscrim.on{display:block}
.gpanel{position:fixed;right:24px;bottom:78px;z-index:91;width:292px;max-height:min(72vh,600px);overflow-y:auto;background:#fff;border-radius:18px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 22px 50px -12px rgba(0,0,0,.35);padding:6px 6px 8px;display:none;scrollbar-width:thin}
.gpanel.on{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gpanel .grab{display:none}
.gpanel h6{margin:12px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.gitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;height:38px;padding:0 10px;border-radius:10px;font-size:13.5px;color:var(--ink)}
.gitem:hover{background:var(--chip)}
.gitem.cur{background:var(--green-t);color:var(--kale);font-weight:700}
.gitem .n{width:18px;flex:none;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.gitem.cur .n{color:var(--green)}
.gitem .bdg{margin-left:auto}
.pulse{animation:pulse 2.4s ease-out 1;outline:3px solid transparent;outline-offset:3px}
.pulse.in{outline-offset:-3px}
@keyframes pulse{12%{outline-color:#ff7009}70%{outline-color:#ff7009}100%{outline-color:rgba(255,112,9,0)}}

/* ================= app shell ================= */
#app{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:#fff;isolation:isolate}
.sbar{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-weight:600;font-size:15.5px;z-index:50;pointer-events:none;color:var(--ink)}
.sbar.light{color:#fff}
.sbar .ic{display:flex;gap:6px;align-items:center}
#view{position:absolute;left:0;right:0;top:0;bottom:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.screen.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
.screen.enter-back{animation:enterb .24s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes enterb{from{transform:translateX(-18px);opacity:.4}to{transform:none;opacity:1}}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.pad-top{height:50px;flex:none}

/* store header (home) */
.store{background:var(--kale);color:#fff;padding:0 16px 14px;border-radius:0 0 22px 22px;flex:none}
.store-top{display:flex;align-items:center;justify-content:space-between;height:46px}
.store-top .round{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.store-id{display:flex;flex-direction:column;align-items:center;gap:1px}
.store-logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.store-logo .leaf{width:22px;height:22px;border-radius:7px;background:#fff;display:grid;place-items:center}
.store-sub{font-size:11.5px;color:#a9d2bd;display:flex;align-items:center;gap:3px}
.sbox{display:flex;align-items:center;gap:10px;height:46px;border-radius:999px;background:#fff;color:var(--ink-2);padding:0 16px;width:100%;text-align:left;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.sbox b{color:var(--ink);font-weight:600}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;height:34px;border-radius:999px;font-size:13.5px;font-weight:600;color:#cfe5d9;background:rgba(255,255,255,.08)}
.seg button.on{background:#fff;color:var(--kale)}
.eta{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:#cfe5d9}
.eta b{color:#fff}

/* section heads */
.sec{padding:20px 0 4px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:19px;letter-spacing:-.4px;font-weight:750}
.sec-h a,.sec-h button{font-size:13.5px;color:var(--green);font-weight:600}
.sec-sub{padding:0 16px;margin:-8px 0 12px;font-size:12.5px;color:var(--ink-2)}
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 6px;scroll-padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row > *{scroll-snap-align:start;flex:none}

/* product tile */
.tile{width:132px;position:relative}
.tile .im{position:relative;aspect-ratio:1/1;border-radius:14px;background:var(--img);display:grid;place-items:center;overflow:visible}
.tile .im svg,.tile .im img{width:84%;height:84%;object-fit:contain}
.tile .addc{position:absolute;right:6px;bottom:6px}
.price{font-weight:800;font-size:17px;letter-spacing:-.3px;display:flex;align-items:flex-start;gap:1px;line-height:1.1;margin-top:8px}
.price sup{font-size:10.5px;margin-top:2px}
.price .was{font-weight:500;color:var(--ink-3);text-decoration:line-through;font-size:12px;margin:3px 0 0 6px}
.price.deal{color:#c22b14}
.pname{font-size:13.5px;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.psize{font-size:12px;color:var(--ink-2);margin-top:2px}
.spon{font-size:11.5px;color:var(--ink-2);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:#fff3e8;color:#b24e00;margin-top:4px}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:0 16px}
.grid .tile{width:auto}

/* add control */
.addc{display:inline-flex;align-items:center;height:36px;border-radius:999px;background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:width .2s;z-index:3}
.addc .plus{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.addc .lbl{font-weight:700;font-size:14px;padding-right:14px;margin-left:-4px}
.addc.qty{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.addc.qty .q{min-width:22px;text-align:center;font-weight:800;font-size:14px}
.addc.qty .plus{color:var(--green)}
.addc.wide{height:44px;width:100%;justify-content:center;box-shadow:none}
.addc.wide .plus{width:44px;height:44px}
.addc.wide.qty{background:var(--green-t);color:var(--kale);justify-content:space-between;padding:0 4px}
.addc.wide .lbl{font-size:15px}
.addc.sm{height:30px}
.addc.sm .plus{width:30px;height:30px}

/* buttons */
.btn-g{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:15px}
.btn-g:active{background:var(--green-d)}
.btn-g.block{width:100%}
.btn-o{display:flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border-radius:999px;background:var(--chip);color:var(--ink);font-weight:600;font-size:14px}

/* search header */
.shdr{display:flex;align-items:center;gap:8px;padding:4px 12px 10px;flex:none;background:#fff}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--chip)}
.sfield{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:42px;border-radius:999px;background:var(--chip);padding:0 8px 0 14px;border:1.5px solid transparent}
.sfield:focus-within{border-color:var(--kale);background:#fff}
.sfield input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
.sfield .clr{width:24px;height:24px;border-radius:50%;background:#dcdee1;display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line-2)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;background:#fff}
.chip.on{background:var(--kale);border-color:var(--kale);color:#fff}

/* suggestions */
.sugg{padding:8px 0}
.sugg-h{font-size:13px;font-weight:700;color:var(--ink-2);padding:12px 16px 6px}
.sugg-i{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left}
.sugg-i:active{background:var(--chip)}
.sugg-i .ic{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none;overflow:hidden}
.sugg-i .ic img{width:34px;height:34px;object-fit:contain}
.sugg-i .t{flex:1;min-width:0}
.sugg-i .t b{display:block;font-size:15px;font-weight:600}
.sugg-i .t span{font-size:12.5px;color:var(--ink-2)}
.sugg-i .tag{font-size:11px;font-weight:700;color:var(--green);background:var(--green-t);padding:3px 8px;border-radius:999px;white-space:nowrap}

/* flick host */
.flick{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--img)}
.flick iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.fstate{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .45s;background:var(--img)}
.fstate.hide{opacity:0}
.fstate.load::after{content:"";width:28px;height:28px;border-radius:50%;border:3px solid #dcdfe2;border-top-color:var(--green);animation:spin .9s linear infinite}
.fstate.err{background:#2b1414;color:#ffd9d4;pointer-events:auto;padding:18px;text-align:center;font-size:12px;line-height:1.5}
.fstate.err b{display:block;font-size:14px;margin-bottom:6px;color:#fff}
.fwarn{position:absolute;left:8px;bottom:8px;font-size:11px;background:#fff6db;color:#7a5600;border-radius:999px;padding:3px 9px;pointer-events:none;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
.flickbox{border-radius:16px;overflow:hidden;position:relative;transform:translateZ(0)}
.flick-pill{position:absolute;left:10px;bottom:10px;z-index:2;pointer-events:none}

/* ad label */
.adlbl{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:8px}
.adlbl b{font-size:15px;font-weight:700}
.adlbl .spon{font-size:12px}

/* sponsored product (search) */
.spcard{margin:14px 16px 6px;border-radius:20px;border:1px solid var(--line);overflow:hidden;background:#fff}
.spcard .flickbox{border-radius:0}
.spinfo{display:flex;gap:12px;align-items:flex-end;padding:12px 14px 14px}
.spinfo .meta{flex:1;min-width:0}
.spinfo .price{margin-top:0}
.spinfo .addc.wide{width:auto;padding:0 2px}
.spinfo .addc.wide:not(.qty){padding-right:4px}
.spfoot{display:flex;align-items:center;gap:8px;padding:0 14px 12px;font-size:12px;color:var(--ink-2)}
.spfoot .dots{display:flex;gap:4px}
.spfoot .dots i{width:6px;height:6px;border-radius:50%;background:#d5d8db;transition:background .2s,width .2s}
.spfoot .dots i.on{background:var(--green);width:16px;border-radius:4px}

/* home sponsored tile */
.htile{width:236px}
.htile .flickbox{border-radius:16px}
.htile .info{display:flex;align-items:flex-end;gap:8px}
.htile .info .meta{flex:1;min-width:0}

/* shoppable video + shoppable display (lifted card, as in Instacart's own units) */
.shop{margin:18px 12px 10px;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 12px 30px -12px rgba(0,0,0,.28)}
.shop-h{display:flex;align-items:center;gap:11px;padding:12px 12px 12px 14px;width:100%;text-align:left}
.shop-h .t{flex:1;min-width:0}
.shop-h .t b{display:block;font-size:16px;font-weight:700;letter-spacing:-.25px;line-height:1.2}
.shop-h .t span{font-size:12px;color:var(--ink-2)}
.shop-h .go{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.shop .flickbox{border-radius:0}
.svprods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 12px 14px}
.svp{position:relative;text-align:left;cursor:pointer}
.svp .im{position:relative;aspect-ratio:1/1;border-radius:12px;background:var(--img);display:grid;place-items:center;transition:box-shadow .2s}
.svp .im img{width:88%;height:88%;object-fit:contain;transition:transform .25s}
.svp.on .im{box-shadow:0 0 0 2px var(--green)}
.svp.on .im img{transform:scale(1.04)}
.svp .addc{position:absolute;right:-5px;top:-5px}
.svp .price{font-size:13.5px;margin-top:7px}
.svp .price sup{font-size:9px}
.svp .pname{font-size:12.5px;line-height:1.25}
.svp .psize{font-size:11.5px}
.svp .now{position:absolute;left:6px;bottom:6px;font-size:9.5px;font-weight:800;letter-spacing:.2px;background:var(--green);color:#fff;border-radius:5px;padding:2px 6px;opacity:0;transform:translateY(3px);transition:all .2s}
.svp.on .now{opacity:1;transform:none}
.shop-kind{display:inline-flex;align-items:center;gap:4px}

/* brand page */
.pg-strip{display:flex;align-items:center;gap:10px;margin:14px 16px 4px;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.pg-strip .t{flex:1;min-width:0}
.pg-strip .t b{display:block;font-size:13.5px}
.pg-strip .t span{font-size:12px;color:var(--green);display:flex;align-items:center;gap:4px;font-weight:600}
.btile{width:150px;position:relative;cursor:pointer}
.btile .im{position:relative;height:180px;border-radius:14px;background:var(--img);display:grid;place-items:center;transition:box-shadow .2s}
.btile .im img{width:90%;height:80%;object-fit:contain}
.btile.on .im{box-shadow:0 0 0 2px var(--green)}
.btile .addc{position:absolute;right:6px;top:6px}
.rtile{width:200px;text-align:left}
.rtile .im{height:120px;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.rtile .im img{height:86%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.rtile b{display:block;font-size:13.5px;margin-top:8px;line-height:1.3}
.rtile span{font-size:12px;color:var(--ink-2)}

/* cart chip in headers */
.cartchip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:999px;background:var(--green);color:#fff;font-weight:800;font-size:14px;flex:none}
.cartchip.bump{animation:chip .4s}
@keyframes chip{40%{transform:scale(1.12)}}

/* brand badges */
.bdg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:-.4px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.bdg.sm{width:22px;height:22px;font-size:8.5px}
.bdg.xs{width:18px;height:18px;font-size:7.5px}
.bdg.bk{background:#f5ebdc;color:#d62300}
.bdg.lc{background:#f47b20;color:#fff}
.bdg.gm{background:#fff;color:#1d3f8f;font-size:15px;font-family:Georgia,serif;font-style:italic}
.bdg.gm.sm{font-size:11px}.bdg.gm.xs{font-size:10px}

/* restaurants */
.rest{width:200px}
.rest .cover{height:104px;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center}
.rest .cover img{height:92%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.rest .cover .bdg{position:absolute;left:8px;bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.rest b{display:block;font-size:14px;margin-top:8px}
.rest span{font-size:12px;color:var(--ink-2)}

/* recipe ad */
.rcard{margin:14px 16px 6px;border-radius:20px;border:1px solid var(--line);padding:12px 12px 14px;background:#fff}
.rcard .rhead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.rcard .rhead b{font-size:14px}
.rtitle{display:flex;align-items:center;gap:10px;margin:12px 2px 0}
.rtitle h3{margin:0;font-size:17px;letter-spacing:-.3px;line-height:1.2}
.rtitle .t{flex:1;min-width:0}
.rmeta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.rings{display:flex;justify-content:space-around;gap:6px;margin:14px 0 14px}
.ring{display:flex;flex-direction:column;align-items:center;width:76px;text-align:center}
.ring .im{width:58px;height:58px;border-radius:14px;background:var(--img);display:grid;place-items:center;overflow:hidden}
.ring .im img,.ring .im svg{width:86%;height:86%;object-fit:contain}
.ring span{font-size:11.5px;line-height:1.25;margin-top:6px;color:var(--ink)}
.fade-swap{animation:fswap .35s ease}
@keyframes fswap{from{opacity:.2;transform:translateY(3px)}to{opacity:1;transform:none}}

/* recipe page */
.rp-hdr,.pp-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 8px 6px;flex:none;background:#fff}
.rp-hdr .r{display:flex;gap:2px;align-items:center}
.rp-hdr .ttl,.pp-hdr .ttl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.hero{margin:0}
.hero .flickbox{border-radius:0}
.rp-body{padding:16px 16px 120px}
.rp-by{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.rp-body h1{margin:8px 0 10px;font-size:24px;line-height:1.15;letter-spacing:-.6px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:600}
.ing-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 4px}
.ing-h h2,.dir-h{margin:0;font-size:18px;letter-spacing:-.3px}
.ing-h button{color:var(--green);font-weight:600;font-size:13.5px}
.ing{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.ing .chk{width:22px;height:22px;border-radius:6px;border:2px solid #c8cbcf;display:grid;place-items:center;flex:none;transition:all .15s}
.ing.sel .chk{background:var(--green);border-color:var(--green)}
.ing .im{width:52px;height:52px;border-radius:12px;background:var(--img);display:grid;place-items:center;flex:none;overflow:hidden}

.sticky{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 22%);z-index:6}

/* product page */
.pp-body{padding:16px 16px 140px}
.pp-brand{font-size:13.5px;font-weight:600;color:var(--green)}
.pp-body h1{margin:4px 0 4px;font-size:22px;letter-spacing:-.5px;line-height:1.2}
.pp-price{display:flex;align-items:baseline;gap:10px;margin:10px 0 16px}
.pp-price .price{font-size:26px;margin:0}
.pp-price .price sup{font-size:14px}
.pp-price span{font-size:13px;color:var(--ink-2)}
.opt-h{font-size:14px;font-weight:700;margin:4px 0 10px}
.opt-h span{color:var(--ink-2);font-weight:500}
.opts{display:flex;gap:10px}
.opt{width:76px;border-radius:14px;border:2px solid var(--line);padding:4px;transition:border-color .2s}
.opt.on{border-color:var(--green)}
.opt .im{aspect-ratio:1/1;border-radius:10px;background:var(--img);display:grid;place-items:center;overflow:hidden}
.opt .im img{width:90%;height:90%;object-fit:contain}
.about{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}
.about h2{font-size:16px;margin:0 0 6px}
.about p{margin:0;font-size:13.5px;line-height:1.5;color:#55595f}

/* product pages */
.pdots{display:flex;justify-content:center;gap:6px;padding:12px 0 0}
.pdots i{width:6px;height:6px;border-radius:3px;background:#d5d8db;transition:all .2s}
.pdots i.on{width:18px;background:var(--kale)}
.pd-art{aspect-ratio:1/1;background:var(--img);display:grid;place-items:center}
.pd-art svg,.pd-art img{width:62%;height:62%;object-fit:contain}
.pd{padding:10px 16px 130px}
.pd-brand{color:var(--green);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.pd-brand svg{transform:rotate(-90deg)}
.pd h1{font-size:22px;margin:4px 0 4px;line-height:1.22;letter-spacing:-.5px}
.pd-size{font-size:13.5px;color:var(--ink-2)}
.pd-pr{display:flex;align-items:center;gap:12px;margin:12px 0 2px}
.pd-pr .price{font-size:28px;margin:0}
.pd-pr .price sup{font-size:15px;margin-top:3px}
.stock{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--green);background:var(--green-t);padding:5px 10px;border-radius:999px}

.pd-opt{margin:20px 0 4px}
.pd-opt h3{font-size:15px;margin:0 0 10px}

.pd-card{display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:12px 14px;border-radius:14px;background:var(--chip)}

.pd-card span{font-size:12px;color:var(--ink-2)}
.pd-sec{border-top:1px solid var(--line-2);margin-top:22px;padding-top:16px}
.pd-sec h2{font-size:17px;margin:0 0 8px;letter-spacing:-.3px}
.pd-sec p{margin:0;font-size:14px;line-height:1.55;color:#4a4d52}
.pd-dl{display:grid;grid-template-columns:104px 1fr;gap:9px 12px;font-size:13.5px;margin:0}
.pd-dl dt{color:var(--ink-2)}
.pd-dl dd{margin:0}
.pd .row{margin:0 -16px}
.pd .sec{padding-top:22px}
.pd .sec-h{padding:0}
.pd-bar{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 28px;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;z-index:6}

.radio .pr{margin-left:auto;color:var(--ink-2);font-size:13.5px}
.note{display:block;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;min-height:66px;resize:none;outline:none;margin-top:8px}

.qstep{display:flex;align-items:center;height:52px;border-radius:999px;border:1.5px solid var(--line);flex:none}

.rbtn{flex:1;height:52px;justify-content:space-between;padding:0 20px;font-size:16px}
.rbtn.done{background:var(--kale)}

/* bottom nav */
.bnav{flex:none;display:flex;justify-content:space-around;align-items:flex-start;height:82px;padding-top:9px;border-top:1px solid var(--line);background:#fff}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2);width:76px}

/* cart pill */
.cartpill{position:absolute;left:50%;transform:translate(-50%,20px);bottom:98px;z-index:20;height:50px;padding:0 20px 0 16px;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px -8px rgba(16,137,16,.7);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1)}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;background:#fff;border-radius:24px 24px 0 0;z-index:41;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}

.sheet .grab{width:40px;height:5px;border-radius:3px;background:#dcdee1;margin:8px auto 4px}

.sheet-h h2{margin:0;font-size:20px;letter-spacing:-.4px}

.cgrp{padding:6px 0 4px}
.cgrp-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:8px 0}

.cline{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.cline .im{width:54px;height:54px;border-radius:12px;background:var(--img);display:grid;place-items:center;flex:none;overflow:hidden}
.cline .im img,.cline .im svg{width:86%;height:86%;object-fit:contain}
.cline .t{flex:1;min-width:0}
.cline .t b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.cline .t span{font-size:12px;color:var(--ink-2)}
.cline .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cline .r .pr{font-weight:700;font-size:14px}
.sheet-f{padding:12px 16px 30px;border-top:1px solid var(--line)}
.sum{display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px}
.sum b{font-size:16px}
.empty{padding:30px 10px 40px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin:10px 0 4px}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:160px;z-index:60;background:#1f2321;color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast .ti{width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.toast .ti img{width:26px;height:26px;object-fit:contain}
.toast.low{bottom:96px}

/* concept ribbon inside app */
.foot-note{padding:22px 16px 30px;font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.5}

/* ================= mobile ================= */
@media (max-width: 860px){
  body{background:#fff}
  .page{display:block}
  .stagewrap{padding:0;min-height:0;display:block}
  .stagewrap::before{display:none}
  .phone-slot{width:100% !important;height:auto !important}
  .phone{position:relative;width:auto;height:auto;padding:0;border-radius:0;background:none;box-shadow:none;transform:none !important}
  .phone::after{display:none}
  #app{width:100vw;height:100dvh;border-radius:0}
  .sbar{display:none}
  .pad-top{height:8px}
  .store{padding-top:6px}
  .gpill{right:12px;bottom:calc(150px + env(safe-area-inset-bottom));height:38px;padding:0 10px 0 13px;font-size:13px}
  .gscrim.on{background:rgba(0,0,0,.45)}
  .gpanel{left:0;right:0;bottom:0;width:auto;max-height:62vh;border-radius:20px 20px 0 0;padding:8px 8px calc(14px + env(safe-area-inset-bottom))}
  .gpanel .grab{display:block;width:38px;height:5px;border-radius:3px;background:#dcdee1;margin:2px auto 6px}
  .gitem{height:44px;font-size:14.5px}
}

/* ================= cart ================= */
const CART = {}; // pid -> qty
function qty(pid){ return CART[pid] || 0; }
function addCtl(pid, mode=""){
  return `<div class="addc ${mode}" data-pid="${pid}" data-mode="${mode}">${addInner(pid, mode)}</div>`;
}
function addInner(pid, mode){
  const q = qty(pid);
  if(!q) return `<button class="plus" data-act="inc" aria-label="Add ${esc(P[pid].n)}">${I.plus}</button>${mode.includes("wide")?`<span class="lbl" data-act="inc">Add to cart</span>`:""}`;
  return `<button class="plus" data-act="dec" aria-label="Remove one">${q===1?I.trash:I.minus}</button><span class="q">${q}</span><button class="plus" data-act="inc" aria-label="Add one">${I.plus}</button>`;
}
function setPid(el, pid){ el.dataset.pid = pid; }
function refreshAdds(){
  document.querySelectorAll(".addc[data-pid]").forEach(el=>{
    const pid=el.dataset.pid, mode=el.dataset.mode||"";
    el.classList.toggle("qty", qty(pid)>0);
    el.innerHTML = addInner(pid, mode);
  });
  const n = Object.values(CART).reduce((a,b)=>a+b,0);
  const pill = document.getElementById("cartpill");
  document.getElementById("cartn").textContent = n;
  document.querySelectorAll("[data-cartn]").forEach(el=>el.textContent = n);
  pill.classList.toggle("show", n>0);
  if(document.getElementById("sheet").classList.contains("on")) renderCart();
}
function addToCart(pid, n=1, silent=false){
  CART[pid] = qty(pid) + n;
  if(CART[pid] <= 0) delete CART[pid];
  if(n>0){
    const x=P[pid];
    if(!silent) toast(`Added ${x.n}`, pid);
    [document.getElementById("cartpill"),...document.querySelectorAll(".cartchip")].forEach(el=>{ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); });
  }
  refreshAdds();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const host = b.closest(".addc[data-pid]"); if(!host) return;
  e.stopPropagation(); e.preventDefault();
  addToCart(host.dataset.pid, b.dataset.act==="inc"?1:-1, b.dataset.act!=="inc");
}, true);

function openCart(){ renderCart(); document.getElementById("sheet").classList.add("on"); document.getElementById("sheetbg").classList.add("on"); }
function closeCart(){ document.getElementById("sheet").classList.remove("on"); document.getElementById("sheetbg").classList.remove("on"); }
function renderCart(){
  const ids = Object.keys(CART);
  const groups = {};

/* ================= Flick slots ================= */
let SLOTS = {};
const VMEM = {}, SCROLL = {}; let CURH = "#/home";
function flick(id, brand, opt={}){
  // Coming back to a screen restores the option the shopper last picked in each Flick.
  const v = opt.v != null ? opt.v : (VMEM[CURH+"|"+id] || 0);
  SLOTS[id] = { id, brand, v, want:v, ready:false, error:false, mounted:false, on:opt.on||null, cta:opt.cta||"product", lastCta:0, prog:0, timer:null };
  return `<div class="flick" data-slot="${id}"><div class="fstate load"></div></div>`;
}
let io=null;
function observeFlicks(root){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting) mount(en.target); }), {root, rootMargin:"400px 0px"});
  document.querySelectorAll("#view .flick[data-slot]").forEach(h=>io.observe(h));
  // Fallback: some browsers pause the observer in background or embedded views,
  // so also mount anything near the visible area directly, now and on scroll.
  if(root){ mountNear(root); root.addEventListener("scroll", ()=>{ clearTimeout(nearT); nearT=setTimeout(()=>mountNear(root),120); }, {passive:true}); }
  setTimeout(()=>root && mountNear(root), 300);
}
let nearT;
function mountNear(root){
  if(!root.isConnected) return;
  const rr = root.getBoundingClientRect(), pad = 400 * (rr.height / (root.clientHeight || rr.height || 1));
  root.querySelectorAll(".flick[data-slot]").forEach(h=>{
    const r = h.getBoundingClientRect();
    if(r.bottom > rr.top - pad && r.top < rr.bottom + pad) mount(h);
  });
}
function mount(host){
  const s = SLOTS[host.dataset.slot]; if(!s || s.mounted) return;
  s.mounted = true;
  const f = document.createElement("iframe");
  f.title = `${BRANDS[s.brand].name} Flick`; f.setAttribute("allow","autoplay; fullscreen"); f.setAttribute("scrolling","no");
  f.srcdoc = tagDoc(s.id, BRANDS[s.brand]);
  host.prepend(f);
  s.timer = setTimeout(()=>{
    if(s.ready||s.error) return;
    host.querySelector(".fstate")?.classList.add("hide");
    if(!host.querySelector(".fwarn")) host.insertAdjacentHTML("beforeend",`<span class="fwarn">No ready signal from Flick yet</span>`);
    console.warn("[flicks] no vertex-ready from", s.id, BRANDS[s.brand].src);
  }, 9000);
}
function swatches(id){
  const host = document.querySelector(`.flick[data-slot="${id}"]`);
  try{ return host.querySelector("iframe").contentDocument.querySelector("vertex-player").shadowRoot.querySelectorAll(".vx-swatch"); }catch(e){ return []; }
}
// Switch the Flick from outside (product cards, flavor chips). Falls back to UI-only if the player isn't reachable.
function setVariant(id, i){
  const s = SLOTS[id]; if(!s) return;
  s.want = i;
  if(s.ready){
    const sw = swatches(id);
    if(sw[i]){ s.prog = Date.now(); sw[i].click(); }
    else console.warn("[flicks] swatch not reachable for", id);
  }
  applyVariant(id, i);
}
function applyVariant(id, i){
  const s = SLOTS[id]; if(!s) return;
  const changed = s.v !== i;
  s.v = i; VMEM[CURH+"|"+id] = i;
  document.querySelectorAll(`[data-sync="${id}"]`).forEach(el=>el.classList.toggle("on", +el.dataset.i===i));
  if(s.on) s.on(i, changed);
}
window.addEventListener("message", e=>{
  const m = e.data; if(!m || m.flam!==1) return;
  const s = SLOTS[m.slot]; if(!s) return;
  const host = document.querySelector(`.flick[data-slot="${m.slot}"]`);
  if(!host || e.source !== host.querySelector("iframe")?.contentWindow) return;
  if(m.type==="ready"){
    s.ready = true; clearTimeout(s.timer);
    host.querySelector(".fstate")?.classList.add("hide"); host.querySelector(".fwarn")?.remove();
    if(s.want !== s.v || s.want !== 0) setTimeout(()=>setVariant(m.slot, s.want), 60);
  } else if(m.type==="error"){
    s.error = true; clearTimeout(s.timer); console.error("[flicks] render error", m.slot, m.msg);
    const st = host.querySelector(".fstate"); st.className = "fstate err";
    st.innerHTML = `<div><b>Flick failed to load</b>${esc(m.msg)}<br><br>Open this page directly in Chrome. Preview windows block ad scripts.</div>`;
  } else if(m.type==="switch"){
    const n = BRANDS[s.brand].variants.length;
    const d = Math.max(0, Math.min(m.diff, n-1));
    if(m.initial && s.want !== 0) return; // keep the option we're about to restore
    applyVariant(m.slot, d);
  } else if(m.type==="cta" || m.type==="tap"){
    // Any click-through on a Flick ad opens the product page for the option on screen.
    // On the product page itself, the Flick's button adds to cart and a tap does nothing.
    const now = Date.now(); if(now - s.lastCta < 900) return; s.lastCta = now;
    if(s.cta==="add"){ if(m.type==="cta") addToCart(`${s.brand}-${s.v}`); }
    else go(`#/product/${s.brand}/${s.v}`);
  }
});

    </div>
    <div class="sticky"><button class="btn-g block" id="rpadd" onclick="addRecipe()"></button></div>
  </div>`;
}
let RSEL = new Set();
function fillRecipe(i){
  const r = RECIPES[i];
  RSEL = new Set(r.ings.map(x=>x[0]));
  document.getElementById("rpbody").innerHTML = `
    <div class="rp-by">${bdg("gm","xs")}<span>Sponsored by <b style="color:var(--ink)">General Mills</b></span></div>
    <h1 class="fade-swap">${esc(r.title)}</h1>
    <div class="pills"><span class="pill">${I.clock}${r.time}</span><span class="pill">${I.people}Serves ${r.serves}</span><span class="pill">${I.bag}${r.ings.length} ingredients</span></div>
    <div class="ing-h"><h2>Ingredients</h2><button onclick="toggleAll()">Select all</button></div>
    ${r.ings.map(([pid,amt])=>`<button class="ing sel" data-ing="${pid}" onclick="toggleIng('${pid}')"><span class="chk">${I.check}</span><span class="im">${pimg(pid)}</span><span class="t"><b>${esc(P[pid].n)}${P[pid].brand?`<span class="feat">Featured</span>`:""}</b><span>${esc(amt)} · ${esc(P[pid].s)}</span></span><span class="pr">${money(P[pid].p)}</span></button>`).join("")}
    <h2 class="dir-h">Directions</h2>
    ${r.steps.map((s,n)=>`<div class="step"><i>${n+1}</i><p>${esc(s)}</p></div>`).join("")}
    <div class="foot-note">Switch the cereal in the video above to change the recipe.</div>`;
  updateRecipeBtn();
}
function toggleIng(pid){ RSEL.has(pid)?RSEL.delete(pid):RSEL.add(pid); document.querySelector(`.ing[data-ing="${pid}"]`).classList.toggle("sel", RSEL.has(pid)); updateRecipeBtn(); }
function toggleAll(){ const all=[...document.querySelectorAll(".ing")].map(e=>e.dataset.ing); const on = RSEL.size<all.length; RSEL=new Set(on?all:[]); document.querySelectorAll(".ing").forEach(e=>e.classList.toggle("sel",on)); updateRecipeBtn(); }
function updateRecipeBtn(){
  const t = [...RSEL].reduce((a,id)=>a+P[id].p,0);
  document.getElementById("rpadd").innerHTML = RSEL.size ? `<span>Add ${RSEL.size} ingredient${RSEL.size>1?"s":""} to cart</span><span>${money(t)}</span>` : `<span>Select ingredients</span><span></span>`;
}
function addRecipe(){
  if(!RSEL.size) return;
  const n = RSEL.size; RSEL.forEach(id=>addToCart(id,1,true));
  toast(`Added ${n} ingredients to your cart`, [...RSEL].find(id=>P[id].brand));
  setTimeout(openCart, 450);
}

const GROUPS = {
  cereal:["oat-rings","granola","corn-flakes","choc-puffs","bran","oats"],
  milk:["milk-2","milk-whole","milk-oat","milk-almond","milk-lf","milk-choc"],
  burger:["buns","patties","cheese-sl","pickles","ketchup","rings"],
  pizza:["fz-marg","fz-pep","dough","sauce","mozz","pepperoni"],
  recipe:["marsh","butter","vanilla","yogurt","mberries","honey","eggs","brioche","maple","bananas"]
};
const groupOf = pid => Object.keys(GROUPS).find(g=>GROUPS[g].includes(pid)) || "recipe";
function unitPrice(x){
  const m = /^([\d.]+)\s*(fl oz|oz)$/.exec(x.s||""); if(!m) return "";
  return `$${(x.p/parseFloat(m[1])).toFixed(2)}/${m[2]}`;
}
const CHECK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

function productScreen(k, i){
  if(!BRANDS[k]) k = "gm";
  i = Math.max(0, Math.min(BRANDS[k].variants.length-1, i|0));
  return k === "gm" ? groceryPage(`${k}-${i}`) : restaurantPage(k, i);
}
function itemScreen(pid){
  if(!P[pid]) pid = "milk-2";
  if(P[pid].brand) return productScreen(P[pid].brand, P[pid].vi);
  return groceryPage(pid);
}
// Grocery item page. For a General Mills product the hero is the Flick and the flavor chips stay in sync with it.
function groceryPage(pid){
  const x = P[pid], k = x.brand, b = k ? BRANDS[k] : null;
  const g = k ? "cereal" : groupOf(pid);
  const up = unitPrice(x);
  const hero = k
    ? `<div class="flickbox">${flick("pp", k, {v:x.vi, cta:"add", on:j=>syncPP(k,j)})}</div><div class="pdots">${b.variants.map((_,j)=>`<i data-sync="pp" data-i="${j}" class="${j===x.vi?"on":""}"></i>`).join("")}</div>`
    : `<div class="pd-art">${pimg(pid)}</div>`;
  const brandLine = k
    ? `<button class="pd-brand" onclick="go('#/page/${k}')">${b.name} ${I.chev}</button>`
    : `<span class="pd-brand" style="color:var(--ink-2)">Greenleaf Market</span>`;
  const opts = k ? `<div class="pd-opt"><h3>Flavor: <span data-pp="short">${esc(b.variants[x.vi].short)}</span></h3>
      <div class="ochips">${b.variants.map((v,j)=>`<button class="ochip ${j===x.vi?"on":""}" data-sync="pp" data-i="${j}" onclick="setVariant('pp',${j})"><img src="${v.img}" alt="">${esc(v.short)}</button>`).join("")}</div></div>` : "";
  const desc = DESC[pid] || `${x.n}, ${x.s}. Picked fresh and delivered from Greenleaf Market.`;
  const also = (k ? ["milk-2","bananas","mberries","milk-oat","yogurt"] : GROUPS[g].filter(id=>id!==pid).slice(0,5));
  const more = k ? b.variants.map((_,j)=>`${k}-${j}`) : GROUPS[g==="milk"?"cereal":"milk"].slice(0,4);
  return `<div class="screen" data-name="product">
    <div class="pad-top"></div>
    <div class="pp-hdr"><button class="iconbtn" onclick="back()" aria-label="Back">${I.back}</button><span class="ttl">Greenleaf Market</span><span style="display:flex;align-items:center;gap:2px"><button class="iconbtn" onclick="go('#/search/')" aria-label="Search">${I.search}</button>${cartChip()}</span></div>
    <div class="scr" id="scr">
      <div class="hero">${hero}</div>
      <div class="pd">
        ${brandLine}
        <h1 data-pp="name">${esc(x.n)}</h1>
        <div class="pd-size"><span data-pp="size">${esc(x.s)}</span><span data-pp="unit">${up?` · ${up}`:""}</span></div>
        <div class="pd-pr"><span data-pp="price">${priceHTML(x.p, x.was)}</span><span class="stock">${CHECK}Many in stock</span></div>
        ${opts}
        <div class="pd-card"><span class="bdg sm" style="background:#fff">${I.leaf}</span><span class="t"><b>Delivery by 12:40pm</b><span>Greenleaf Market · In-store prices</span></span></div>
        <div class="pd-sec"><h2>Details</h2><p data-pp="desc">${esc(desc)}</p></div>
        <div class="pd-sec"><h2>Product info</h2><dl class="pd-dl"><dt>Brand</dt><dd>${k?b.name:"Greenleaf Market"}</dd><dt>Size</dt><dd data-pp="size2">${esc(x.s)}</dd><dt>Aisle</dt><dd>${AISLE[g]}</dd><dt>Sold by</dt><dd>Greenleaf Market</dd></dl></div>
        <div class="sec"><div class="sec-h"><h2>Often bought with</h2></div><div class="row">${also.map(id=>tile(id)).join("")}</div></div>
        <div class="sec"><div class="sec-h"><h2>${k?"More from "+b.name:"You might also like"}</h2></div><div class="row">${more.map(id=>tile(id)).join("")}</div></div>
      </div>
    </div>
    <div class="pd-bar">${addCtl(pid,"wide")}</div>
  </div>`;
}
function syncPP(k, j){
  const v = BRANDS[k].variants[j], pid = `${k}-${j}`;
  if(k !== "gm"){ syncRP(j); return; }
  const set=(f,h)=>document.querySelectorAll(`[data-pp="${f}"]`).forEach(el=>{ el.innerHTML=h; el.classList.remove("fade-swap"); void el.offsetWidth; el.classList.add("fade-swap"); });
  const up = unitPrice(P[pid]);
  set("name", esc(v.n)); set("price", priceHTML(v.p)); set("size", esc(v.s)); set("size2", esc(v.s)); set("unit", up?` · ${up}`:""); set("short", esc(v.short)); set("desc", esc(DESC[pid]||""));
  const ctl = document.querySelector(".pd-bar .addc"); if(ctl){ setPid(ctl, pid); refreshAdds(); }
  keepHash(`#/product/${k}/${j}`);
}

// Restaurant item page (Burger King, Little Caesars): options, quantity and a total that updates.
// Keep the address in step with the option on screen, so Back returns to it.
function keepHash(h){ history.replaceState(null, "", h); CURH = lastHash = h; if(NAV.length) NAV[NAV.length-1] = h; }
let RO = {k:"bk", i:0, q:1, opt:0};
function restaurantPage(k, i){
  const b = BRANDS[k], v = b.variants[i], ad = ADDON[k];
  RO = {k, i, q:1, opt:0};
  return `<div class="screen" data-name="product">
    <div class="pad-top"></div>
    <div class="pp-hdr"><button class="iconbtn" onclick="back()" aria-label="Back">${I.back}</button><button class="ttl" onclick="go('#/page/${k}')">${bdg(k,"sm")}${b.name}</button>${cartChip()}</div>
    <div class="scr" id="scr">
      <div class="hero"><div class="flickbox">${flick("pp", k, {v:i, cta:"add", on:j=>syncPP(k,j)})}</div><div class="pdots">${b.variants.map((_,j)=>`<i data-sync="pp" data-i="${j}" class="${j===i?"on":""}"></i>`).join("")}</div></div>
      <div class="pd">
        <h1 data-pp="name">${esc(v.n)}</h1>
        <div class="pd-size"><span data-pp="price-t">${money(v.p)}</span> · ${b.name}</div>
        <p data-pp="desc" style="margin:10px 0 0;font-size:14px;line-height:1.5;color:#4a4d52">${esc(DESC[`${k}-${i}`])}</p>
        <div class="pd-card"><span class="bdg sm" style="background:#fff">${I.bolt}</span><span class="t"><b>Delivery in ${b.eta}</b><span>${b.fee} · Hot and fresh from ${b.name}</span></span></div>
        <div class="og"><div class="og-h"><h3>Choose your ${b.unit}</h3><span class="req ok">Selected</span></div>
          <div class="ochips" style="margin-top:12px">${b.variants.map((x,j)=>`<button class="ochip ${j===i?"on":""}" data-sync="pp" data-i="${j}" onclick="setVariant('pp',${j})"><img src="${x.img}" alt="">${esc(x.short)}</button>`).join("")}</div></div>
        <div class="og"><div class="og-h"><h3>${ad.h}</h3><span class="req">Required</span></div><div class="og-sub">${ad.sub}</div>
          <button class="radio on" data-ro="0" onclick="ropt(0)"><span class="r"></span>${ad.none}</button>
          <button class="radio" data-ro="1" onclick="ropt(1)"><span class="r"></span>${ad.label}<span class="pr">+${money(P[ad.pid].p)}</span></button></div>
        <div class="og"><div class="og-h"><h3>Special instructions</h3></div><textarea class="note" placeholder="Add a note for the restaurant"></textarea></div>
        <div class="sec"><div class="sec-h"><h2>More from ${b.name}</h2></div><div class="row">${b.variants.map((_,j)=>tile(`${k}-${j}`)).join("")}</div></div>
      </div>
    </div>
    <div class="pd-bar"><div class="qstep"><button onclick="rq(-1)" aria-label="Less">${I.minus}</button><b id="rq">1</b><button onclick="rq(1)" aria-label="More">${I.plus}</button></div><button class="btn-g rbtn" id="rbtn" onclick="radd()"></button></div>
  </div>`;
}
function syncRP(j){
  const k = RO.k, v = BRANDS[k].variants[j];
  RO.i = j;
  const set=(f,h)=>document.querySelectorAll(`[data-pp="${f}"]`).forEach(el=>{ el.innerHTML=h; el.classList.remove("fade-swap"); void el.offsetWidth; el.classList.add("fade-swap"); });
  set("name", esc(v.n)); set("price-t", money(v.p)); set("desc", esc(DESC[`${k}-${j}`]));
  rtotal();
  keepHash(`#/product/${k}/${j}`);
}
function rq(d){ RO.q = Math.max(1, Math.min(20, RO.q + d)); document.getElementById("rq").textContent = RO.q; rtotal(); }
function ropt(n){ RO.opt = n; document.querySelectorAll("[data-ro]").forEach(el=>el.classList.toggle("on", +el.dataset.ro===n)); document.querySelector(".og .req:not(.ok)")?.classList.add("ok"); rtotal(); }
function rtotal(){
  const btn = document.getElementById("rbtn"); if(!btn) return;
  const v = BRANDS[RO.k].variants[RO.i], extra = RO.opt ? P[ADDON[RO.k].pid].p : 0;
  btn.classList.remove("done");
  btn.innerHTML = `<span>Add ${RO.q} to cart</span><span>${money((v.p+extra)*RO.q)}</span>`;
}
function radd(){
  const pid = `${RO.k}-${RO.i}`;
  addToCart(pid, RO.q, true);
  if(RO.opt) addToCart(ADDON[RO.k].pid, RO.q, true);
  toast(`Added ${RO.q} × ${BRANDS[RO.k].variants[RO.i].n}`, pid);
  const btn = document.getElementById("rbtn"); btn.classList.add("done");
  btn.innerHTML = `<span style="display:flex;align-items:center;gap:8px">${I.check}Added to cart</span><span>View</span>`;
  btn.onclick = ()=>{ openCart(); btn.onclick = radd; rtotal(); };
}

function pageScreen(k){
  if(!BRANDS[k]) k = "gm";
  const b = BRANDS[k];
  const strip = k==="gm"
    ? `<div class="pg-strip"><span class="bdg sm" style="background:#e6f4e6">${I.leaf}</span><span class="t"><b>Greenleaf Market</b><span>${I.bolt}Delivery by 12:40pm</span></span>${I.chev}</div>`
    : `<div class="pg-strip">${bdg(k,"sm")}<span class="t"><b>${b.name}</b><span>${I.bolt}Delivery in ${b.eta}</span></span>${I.chev}</div>`;
  const more = k==="gm"
    ? `<div class="sec"><div class="sec-h"><h2>Recipes from General Mills</h2></div><div class="row">${RECIPES.map((r,i)=>`<button class="rtile" onclick="go('#/recipe/${i}')"><div class="im" style="background:${["#fde8ef","#fff3d9","#f9e6d6"][i]}"><img src="${b.variants[i].img}" alt=""></div><b>${esc(r.title)}</b><span>${r.time} · Serves ${r.serves}</span></button>`).join("")}</div></div>`
    : `<div class="sec"><div class="sec-h"><h2>Goes great with</h2></div><div class="row">${(k==="bk"?["rings","ketchup","milk-choc"]:["mozz","sauce","milk-choc"]).map(id=>tile(id)).join("")}</div></div>`;
  return `<div class="screen" data-name="page">
    <div class="pad-top"></div>
    <div class="pp-hdr"><button class="iconbtn" onclick="back()" aria-label="Back">${I.back}</button><span class="ttl" style="display:flex;align-items:center;gap:8px">${bdg(k,"sm")}${b.name}</span>${cartChip()}</div>
    <div class="scr" id="scr">
      <div class="hero"><div class="flickbox pulse-in" data-anchor="pg">${flick("pg", k)}</div></div>
      ${strip}
      <div class="sec"><div class="sec-h"><h2>Our best sellers</h2><span class="spon">${b.variants.length} items</span></div>
        <div class="row">${b.variants.map((v,i)=>`<div class="btile ${i?"":"on"}" data-sync="pg" data-i="${i}" onclick="pickOrOpen('pg',${i})"><div class="im"><img src="${v.img}" alt="">${addCtl(`${k}-${i}`)}</div>${priceHTML(v.p)}<div class="pname">${esc(v.n)}</div><div class="psize">${esc(v.s)}</div></div>`).join("")}</div>
      </div>
      ${more}

      <div style="height:40px"></div>
    </div>
  </div>`;
}

/* ================= router ================= */
let NAV = [], lastHash = "";
function go(h){ if(location.hash === h) render(false); else location.hash = h; }
function back(){ if(NAV.length > 1) history.back(); else location.hash = "#/home"; }
function parse(){
  const parts = (location.hash || "#/home").replace(/^#\/?/,"").split("/");
  return {name:parts[0]||"home", a:decodeURIComponent(parts[1]||""), b:parts[2]};
}
let pendingAnchor = null;
function render(anim=true){
  const r = parse(), h = location.hash || "#/home";
  const oldScr = document.querySelector("#view #scr"); if(oldScr && lastHash) SCROLL[lastHash] = oldScr.scrollTop;
  let dir = "enter";
  if(NAV.length > 1 && NAV[NAV.length-2] === h){ NAV.pop(); dir = "enter-back"; }
  else if(NAV[NAV.length-1] !== h) NAV.push(h);
  SLOTS = {}; closeCart(); CURH = h;
  let html;
  if(r.name === "search") html = searchScreen(r.a);
  else if(r.name === "recipe") html = recipeScreen(+r.a||0);
  else if(r.name === "product") html = productScreen(r.a, +r.b||0);
  else if(r.name === "page") html = pageScreen(r.a);
  else if(r.name === "item") html = itemScreen(r.a);
  else html = homeScreen();
  const view = document.getElementById("view");
  view.innerHTML = html;
  const scr = view.querySelector(".screen");
  if(anim && lastHash) scr.classList.add(dir);
  lastHash = h;
  if(r.name === "recipe") fillRecipe(Math.max(0,Math.min(2,+r.a||0)));
  if(r.name === "product" && r.a !== "gm" && BRANDS[r.a]) rtotal();
  Object.values(SLOTS).forEach(sl=>{ if(sl.v) applyVariant(sl.id, sl.v); });
  document.getElementById("sbar").classList.toggle("light", r.name === "home");
  const pill = document.getElementById("cartpill");
  pill.classList.toggle("low", r.name !== "home");
  pill.classList.toggle("hidden", r.name !== "home");
  refreshAdds();
  observeFlicks(view.querySelector("#scr"));
  const sc = view.querySelector("#scr");
  if(dir === "enter-back" && SCROLL[h] && sc) sc.scrollTop = SCROLL[h];
  const anc = pendingAnchor || (r.name==="search" ? r.b : null); pendingAnchor = null;
  if(anc) setTimeout(()=>scrollToAnchor(anc), 60);
  if(r.name === "search" && !r.a) setTimeout(()=>view.querySelector("input")?.focus({preventScroll:true}), 250);
  markPicker();
}
window.addEventListener("hashchange", ()=>render(true));

/* ================= ad format picker ================= */
const GUIDE = [
  ["Sponsored products", [["Home: Breakfast picks","#/home","sp","gm"],["Search results: cereal","#/search/cereal","sp","gm"]]],
  ["Shoppable video", [["Search: burger","#/search/burger","sv","bk"],["Search: pizza","#/search/pizza","sv","lc"]]],
  ["Shoppable display", [["Search: cereal","#/search/cereal","sd","gm"]]],
  ["Recipe ads", [["Search: milk","#/search/milk","rc","gm"],["Home: Recipes for you","#/home","rc","gm"]]],
  ["Brand pages", [["General Mills","#/page/gm","pg","gm"],["Burger King","#/page/bk","pg","bk"],["Little Caesars","#/page/lc","pg","lc"]]]
];
let lastAnchor = "";
function buildPicker(){
  let n = 0; const h = location.hash || "#/home";
  document.getElementById("gpanel").innerHTML = `<div class="grab"></div>` + GUIDE.map(([sec, items])=>`<h6>${sec}</h6>` + items.map(([t,route,anchor,k])=>{ n++;
    const cur = route === h && anchor === lastAnchor;
    return `<button class="gitem ${cur?"cur":""}" onclick="pick('${route}','${anchor}')"><span class="n">${n}</span>${t}${bdg(k,"xs")}</button>`; }).join("")).join("");
  document.getElementById("gcount").textContent = n;
}
let pickedHash = "";
function markPicker(){ if((location.hash||"#/home") !== pickedHash) lastAnchor = ""; buildPicker(); }
function togglePicker(force){
  const p = document.getElementById("gpanel"); const on = force === undefined ? !p.classList.contains("on") : force;
  if(on) buildPicker();
  p.classList.toggle("on", on); document.getElementById("gscrim").classList.toggle("on", on);
  document.getElementById("gpill").setAttribute("aria-expanded", on);
}
function pick(route, anchor){
  togglePicker(false); lastAnchor = anchor; pickedHash = route;
  const have = location.hash || "#/home";
  if(have === route) { scrollToAnchor(anchor); buildPicker(); }
  else { pendingAnchor = anchor; location.hash = route; }
}
function scrollToAnchor(a){
  const sc = document.querySelector("#view #scr"), el = sc && sc.querySelector(`[data-anchor="${a}"]`);
  if(!el) return;
  lastAnchor = a;
  const ratio = sc.getBoundingClientRect().height / (sc.clientHeight || 1);
  const top = (el.getBoundingClientRect().top - sc.getBoundingClientRect().top) / ratio + sc.scrollTop - 12;
  sc.scrollTo({top: Math.max(0, top), behavior:"smooth"});
  el.closest(".row")?.scrollTo({left:0, behavior:"smooth"});
  setTimeout(()=>{ el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); if(el.classList.contains("pulse-in")) el.classList.add("in"); }, 250);
}
document.addEventListener("keydown", e=>{ if(e.key === "Escape"){ togglePicker(false); closeCart(); } });

/* ================= phone scaling ================= */
function fit(){
  const slot = document.getElementById("phoneSlot"), phone = document.getElementById("phone");
  if(innerWidth <= 860){ slot.style.width = slot.style.height = ""; phone.style.transform = ""; return; }
  const availW = innerWidth - 48;
  const s = Math.min(1, (innerHeight - 40) / 868, availW / 414);
  phone.style.transform = `scale(${s})`;
  slot.style.width = (414*s) + "px"; slot.style.height = (868*s) + "px";
}
addEventListener("resize", fit);

buildPicker(); fit(); render(false);
</script>
</body>
